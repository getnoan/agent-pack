# Keeps a free-tier Postgres from being paused for inactivity.
#
# Free Supabase projects pause after a week of inactivity. Most of these agents
# run weekly or on demand, so a project can sit idle right on that boundary —
# and a paused database means every stateful agent stops, because a missing
# ledger is treated as an error rather than a first run (deliberately: a ledger
# that looked like day one would re-send everything).
#
# One cheap read every three days removes the whole class of problem. Delete
# this workflow if your database is not on a plan that pauses.
name: Keepalive

on:
  schedule:
    - cron: "41 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Touch the database
        # psql ships with the runner image. No setup step needed.
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not set — nothing to keep alive."
            echo "If you are using STATE_BACKEND=local, delete this workflow."
            exit 0
          fi
          psql "$DATABASE_URL" -Atc "select 1" > /dev/null
          echo "database reachable"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
