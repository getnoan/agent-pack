name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: |
          fail=0
          for f in $(find agents -name '*.mjs' 2>/dev/null); do
            node --check "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done
          exit $fail

      - name: Python syntax
        # design/ arrives with the export; tolerate its absence so CI is green
        # on a tree that has only the starter facts in it.
        run: |
          if [ -d design ]; then python3 -m compileall -q design
          else echo "no design/ in this tree yet — skipping"; fi

      # The tests that travel with the export. They assert the client contract
      # the agents actually run against, and the exported copy is the one that
      # ships — so upstream passing says nothing about this tree.
      #
      # agents/ is grouped by agent (agents/<agent>/, agents/shared/), so the tests sit one
      # folder down, and each runs from its own folder. A test a fork adds directly in agents/
      # is still picked up. Finding none is fine only in a tree that has no export yet: once
      # agents/pack-layout.json exists, an empty loop means the glob no longer matches the
      # layout, and a green run would be checking nothing.
      - name: Unit tests
        run: |
          failed=""; found=0
          for t in agents/test-*.mjs agents/*/test-*.mjs; do
            [ -e "$t" ] || continue
            found=$((found + 1))
            if (cd "$(dirname "$t")" && node "$(basename "$t")") > /tmp/test-out.txt 2>&1; then echo "ok   $t"
            else echo "FAIL $t"; cat /tmp/test-out.txt; failed="$failed $t"; fi
          done
          if [ "$found" = 0 ]; then
            if [ -f agents/pack-layout.json ]; then echo "::error::agents/pack-layout.json exists but no test-*.mjs was found — the test glob no longer matches the layout"; exit 1; fi
            echo "no tests in this tree yet"
          fi
          [ -z "$failed" ] || { echo "::error::failing tests:$failed"; exit 1; }
          echo "$found test file(s) passed"

      # Safe mode is a promise this repo makes to anyone who clones it: a first
      # run shows what it would do rather than doing it. It is one careless edit
      # away from being switched off for everybody, so it is enforced here
      # rather than left to review.
      - name: Safe mode is the default
        run: |
          fail=0
          for f in .github/workflows/*.yml; do
            case "$(basename "$f")" in ci.yml|keepalive.yml) continue ;; esac
            grep -q 'default: "1"' "$f" || { echo "::error file=$f::dry_run must default to \"1\""; fail=1; }
            grep -q "vars.DRY_RUN || '1'" "$f" || { echo "::error file=$f::DRY_RUN must fall back to '1'"; fail=1; }
          done
          exit $fail

      # Nothing in this repository should ever contain a live credential.
      #
      # The gitleaks CLI, not gitleaks-action: the action refuses to run for an
      # organisation without a paid licence key, while the binary itself is MIT
      # and free. Same engine, same .gitleaks.toml, no licence.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # --redact so a finding never prints the secret into a public log.
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1

  # This repository is a generated export. Everything outside the
  # downstream-owned list is re-staged from upstream on every export, so an
  # edit to any other file here is silently reverted by the next one. The
  # check itself is generated by the export from that same list, so there is
  # no second copy to drift. Export branches are exempt by name.
  provenance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        # HEAD is the PR merge commit; depth 2 makes HEAD^1 (the base tip) resolvable.
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Export provenance
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -f scripts/check-provenance.mjs ]; then node scripts/check-provenance.mjs
          else echo "::warning::no scripts/check-provenance.mjs in this tree yet — it arrives with the next export, and until then nothing guards against edits the export will revert."; fi
