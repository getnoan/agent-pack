# Sends a NOAN asset to every contact carrying a tag, exactly once each.
# Manual only, on purpose. Nothing here ever fires on a schedule.
name: Newsletter

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = show what would happen and write nothing. Leave at 1 until you have read a dry run."
        required: false
        default: "1"
      mode:
        description: "dry-run counts and previews. test sends to the test inbox. live sends to the audience, only after a test of this version. cancel withdraws a scheduled send. test, live and cancel also need dry_run set to 0."
        required: true
        default: "dry-run"
        type: choice
        options: [dry-run, test, live, cancel]
      asset:
        description: "Title or id of the NOAN asset to send"
        required: true
      audience_tag:
        description: "Send to every contact carrying this tag (not needed for cancel)"
        required: false
      test_recipient:
        description: "Where test delivers, comma separated. Empty uses the NEWSLETTER_TEST_RECIPIENT variable."
        required: false
      nonce:
        description: "Any new value re-sends an issue already in the ledger"
        required: false

concurrency:
  group: newsletter
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # A fork that enabled Actions before adding its secrets must not fail with
      # a stack trace on every cron tick. GitHub renders a missing secret as an
      # empty string, so each one is read through env (never interpolated into
      # the script) and, if any is empty, the run says which and stops: green,
      # nothing ran. The "not configured yet: NAME" line is a stable format on
      # purpose — the setup wizard reads it to report which agents are ready.
      - name: Configured?
        id: configured
        env:
          NOAN_PERSONAL_API_KEY: ${{ secrets.NOAN_PERSONAL_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWSLETTER_UNSUB_SECRET: ${{ secrets.NEWSLETTER_UNSUB_SECRET }}
        run: |
          ready=1
          for name in NOAN_PERSONAL_API_KEY RESEND_API_KEY DATABASE_URL NEWSLETTER_UNSUB_SECRET; do
            if [ -z "${!name}" ]; then
              echo "not configured yet: $name"
              ready=0
            fi
          done
          if [ "$ready" = 0 ]; then
            echo "::notice::This repository is not configured yet. Add the secrets named above under Settings → Secrets and variables → Actions. Nothing ran."
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Run
        if: steps.configured.outputs.ready == '1'
        run: node agents/newsletter/newsletter-worker.mjs
        env:
          # Who the agents are — see .env.example; unset means the cautious default.
          AGENT_NAME: ${{ vars.AGENT_NAME }}
          AGENT_PRONOUNS: ${{ vars.AGENT_PRONOUNS }}
          COMPANY_NAME: ${{ vars.COMPANY_NAME }}
          AGENT_IDENTITY_IDS: ${{ vars.AGENT_IDENTITY_IDS }}
          COMMANDERS: ${{ vars.COMMANDERS }}
          # The people work is handed to when an agent parks or files a task. Never derived from
          # the agents' own key: under NOAN's agent role that key is the agent's, not a person's.
          HUMAN_IDENTITIES: ${{ vars.HUMAN_IDENTITIES }}
          PARK_ASSIGNEES_CS: ${{ vars.PARK_ASSIGNEES_CS }}
          PARK_ASSIGNEES_SALES: ${{ vars.PARK_ASSIGNEES_SALES }}
          PARK_ASSIGNEES_ENG: ${{ vars.PARK_ASSIGNEES_ENG }}
          TEAMMATE_DOMAIN: ${{ vars.TEAMMATE_DOMAIN }}
          AGENT_ALLOWED_LINKS: ${{ vars.AGENT_ALLOWED_LINKS }}
          EMAIL_WORDMARK_URL: ${{ vars.EMAIL_WORDMARK_URL }}
          EMAIL_FONTS_URL: ${{ vars.EMAIL_FONTS_URL }}
          SCHEDULE_TIMEZONE: ${{ vars.SCHEDULE_TIMEZONE }}
          NOAN_PERSONAL_API_KEY: ${{ secrets.NOAN_PERSONAL_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          REPLY_TO: ${{ vars.REPLY_TO }}
          STATE_BACKEND: ${{ vars.STATE_BACKEND || 'postgres' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || '1' }}
          NEWSLETTER_MODE: ${{ github.event.inputs.mode || 'dry-run' }}
          NEWSLETTER_NONCE: ${{ github.event.inputs.nonce }}
          NEWSLETTER_ASSET: ${{ github.event.inputs.asset }}
          NEWSLETTER_AUDIENCE_TAG: ${{ github.event.inputs.audience_tag }}
          NEWSLETTER_TEST_RECIPIENT: ${{ github.event.inputs.test_recipient || vars.NEWSLETTER_TEST_RECIPIENT }}
          NEWSLETTER_MAX_RECIPIENTS: ${{ vars.NEWSLETTER_MAX_RECIPIENTS }}
          NEWSLETTER_UNSUB_BASE: ${{ vars.NEWSLETTER_UNSUB_BASE }}
          NEWSLETTER_UNSUB_SECRET: ${{ secrets.NEWSLETTER_UNSUB_SECRET }}
          NEWSLETTER_EXCLUDE_TAGS: ${{ vars.NEWSLETTER_EXCLUDE_TAGS }}
          NEWSLETTER_TEST_WINDOW_DAYS: ${{ vars.NEWSLETTER_TEST_WINDOW_DAYS }}
          NEWSLETTER_SEND_AT: ${{ vars.NEWSLETTER_SEND_AT }}
          NEWSLETTER_IMAGE_BASE: ${{ vars.NEWSLETTER_IMAGE_BASE }}
          NEWSLETTER_REPORT_TO: ${{ vars.NEWSLETTER_REPORT_TO }}
          NEWSLETTER_ASSIGNEES: ${{ vars.NEWSLETTER_ASSIGNEES }}
          NEWSLETTER_SUMMARY_OUT: ${{ runner.temp }}/newsletter-summary.md
      - name: Job summary
        if: always() && steps.configured.outputs.ready == '1'
        run: |
          if [ -f "$RUNNER_TEMP/newsletter-summary.md" ]; then
            cat "$RUNNER_TEMP/newsletter-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
