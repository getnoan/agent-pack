# Answers inbound email from your facts, or escalates to a human.
# Set TEST_RECIPIENT while tuning: replies AND escalation forwards go there instead of the sender.
name: Customer support

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = show what would happen and write nothing. Leave at 1 until you have read a dry run."
        required: false
        default: "1"

concurrency:
  group: customer-support
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # A fork that enabled Actions before adding its secrets must not fail with
      # a stack trace on every cron tick. GitHub renders a missing secret as an
      # empty string, so each one is read through env (never interpolated into
      # the script) and, if any is empty, the run says which and stops: green,
      # nothing ran. The "not configured yet: NAME" line is a stable format on
      # purpose — the setup wizard reads it to report which agents are ready.
      - name: Configured?
        id: configured
        env:
          NOAN_PERSONAL_API_KEY: ${{ secrets.NOAN_PERSONAL_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ready=1
          # The model key has two accepted names: ANTHROPIC_API_KEY, or LLM_API_KEY when your
          # endpoint is not Anthropic (see ANTHROPIC_BASE_URL). MODEL_KEY collapses them to one
          # presence check so the list below stays a list. ANTHROPIC_API_KEY is the name
          # REPORTED when neither is set: it is the canonical one, and the wizard reads this line.
          MODEL_KEY="${ANTHROPIC_API_KEY:-$LLM_API_KEY}"
          for name in NOAN_PERSONAL_API_KEY RESEND_API_KEY MODEL_KEY DATABASE_URL; do
            if [ -z "${!name}" ]; then
              case "$name" in MODEL_KEY) name=ANTHROPIC_API_KEY ;; esac
              echo "not configured yet: $name"
              ready=0
            fi
          done
          if [ "$ready" = 0 ]; then
            echo "::notice::This repository is not configured yet. Add the secrets named above under Settings → Secrets and variables → Actions. Nothing ran."
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Run
        if: steps.configured.outputs.ready == '1'
        run: node agents/customer-support/reply-worker.mjs
        env:
          # Who the agents are — see .env.example; unset means the cautious default.
          AGENT_NAME: ${{ vars.AGENT_NAME }}
          AGENT_PRONOUNS: ${{ vars.AGENT_PRONOUNS }}
          COMPANY_NAME: ${{ vars.COMPANY_NAME }}
          AGENT_IDENTITY_IDS: ${{ vars.AGENT_IDENTITY_IDS }}
          COMMANDERS: ${{ vars.COMMANDERS }}
          TEAMMATE_DOMAIN: ${{ vars.TEAMMATE_DOMAIN }}
          AGENT_ALLOWED_LINKS: ${{ vars.AGENT_ALLOWED_LINKS }}
          EMAIL_WORDMARK_URL: ${{ vars.EMAIL_WORDMARK_URL }}
          EMAIL_FONTS_URL: ${{ vars.EMAIL_FONTS_URL }}
          SCHEDULE_TIMEZONE: ${{ vars.SCHEDULE_TIMEZONE }}
          NOAN_PERSONAL_API_KEY: ${{ secrets.NOAN_PERSONAL_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          REPLY_TO: ${{ vars.REPLY_TO }}
          STATE_BACKEND: ${{ vars.STATE_BACKEND || 'postgres' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || '1' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          CS_MODEL: ${{ vars.CS_MODEL }}
          REPLY_DRAFT_MODEL: ${{ vars.REPLY_DRAFT_MODEL }}
          COMMAND_MODEL: ${{ vars.COMMAND_MODEL }}
          SCHEDULE_MODEL: ${{ vars.SCHEDULE_MODEL }}
          AUDIT_EXTRACT_MODEL: ${{ vars.AUDIT_EXTRACT_MODEL }}
          AUDIT_ANALYSIS_MODEL: ${{ vars.AUDIT_ANALYSIS_MODEL }}
          ESCALATE_TO: ${{ vars.ESCALATE_TO }}
          TEST_RECIPIENT: ${{ vars.TEST_RECIPIENT }}
          REPLY_CONFIG_BLOCK_SLUG: ${{ vars.REPLY_CONFIG_BLOCK_SLUG }}
          REPLY_PLAYBOOK_BLOCK_SLUG: ${{ vars.REPLY_PLAYBOOK_BLOCK_SLUG }}
          CS_CONFIG_BLOCK_SLUG: ${{ vars.CS_CONFIG_BLOCK_SLUG }}
